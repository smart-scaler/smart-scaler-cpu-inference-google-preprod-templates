######################################################################
# Project: smart-scaler-cpu-inference-google-preprod-templates
# File: rs-job.yaml  (GCP preprod variant)
#
# Based on smart-scaler-cpu-inference-oracle-prod-templates/rs-job.yaml
# with GCP-specific overrides:
#   - REDIS_HOST: in-cluster GCP Redis (same as OCI prod)
#   - REDIS_MODE: GCP (mTLS with same certs as OCI)
#   - STORAGE_PROVIDER: GCP (GCSStorageClient via ADC/Workload Identity)
#   - No nodeSelector/rightsizing-pool (no dedicated node pool on GCP preprod)
#
# Avesha LLC
# Copyright (c) Avesha LLC. 2024-2025
######################################################################
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    service: right-sizing
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            service: right-sizing
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: data
              emptyDir: {}
            - name: redis-certificates-tls-secrets
              secret:
                secretName: redis-certificates-tls-secrets
            - name: config-volume
              configMap:
                name: rs-config-map
          imagePullSecrets:
            - name: avesha-docker
          containers:
            - name: autoscaler
              image: harbor.saas1.smart-scaler.io/avesha/aveshadev/smart-scaler-pse:1.10.0-SNAPSHOT-1d4c1cba
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                [
                  "python right_sizing/right_size.py -c /data/config/rs-config-cm.json --log-level DEBUG",
                ]
              resources:
                requests:
                  memory: 1Gi
                  cpu: 300m
              env:
                - name: REDIS_HOST
                  value: "smartscaler-saas-redis-master.saas-apis.svc.cluster.local"
                - name: REDIS_PORT
                  value: "6379"
                - name: REDIS_MODE
                  value: "GCP"
                - name: REDIS_AUTH_KEY
                  valueFrom:
                    secretKeyRef:
                      name: redis-auth-secrets
                      key: redis-auth-password
                      optional: true
                - name: STORAGE_PROVIDER
                  value: "GCP"
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: config-volume
                  mountPath: /data/config/rs-config-cm.json
                  subPath: rs-config-cm.json
                - name: redis-certificates-tls-secrets
                  mountPath: /etc/ssl/certs/redis/
          tolerations:
            - key: non-app-pods-no-schedule
              value: 'true'
              effect: NoSchedule
